<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
<title id="title">Road to Seoul — Lean Strength A and B exercise quick reference</title>
<desc id="desc">A two-column original exercise reference with Wednesday and Friday strength routines, sets, reps, and form cues.</desc>
<rect width="1400" height="1160" fill="#f6f3ed"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="70" y="73" font-size="18" letter-spacing="4" font-weight="700" fill="#c43b2e">ROAD TO SEOUL 2027 / STRENGTH REFERENCE</text>
<text x="70" y="150" font-size="70" font-family="Georgia, serif" font-weight="700" fill="#1d1a17">LEAN STRENGTH</text>
<text x="70" y="199" font-size="25" fill="#6d655a">精瘦塑形 × 跑步稳定性 · 每周两次午间训练 · 目标是力量与线条，而不是练股薄肌</text>
<line x1="70" y1="227" x2="1330" y2="227" stroke="#282522" stroke-width="2"/>
<rect x="70" y="250" width="615" height="58" rx="10" fill="#283d4b"/>
<rect x="715" y="250" width="615" height="58" rx="10" fill="#925035"/>
<text x="93" y="288" font-size="25" font-weight="700" fill="white">A · 周三 / WED</text>
<text x="494" y="288" font-size="16" fill="white">30–40 min</text>
<text x="739" y="288" font-size="25" font-weight="700" fill="white">B · 周五 / FRI</text>
<text x="1134" y="288" font-size="16" fill="white">20–30 min</text>
<g><rect x="70" y="332" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="88" y="352" width="44" height="44" rx="22" fill="#365a71" opacity=".14"/><text x="110" y="381" font-size="22" text-anchor="middle" font-weight="700" fill="#365a71">01</text><text x="148" y="358" font-size="14" letter-spacing="2" fill="#365a71" font-weight="700">LOWER / UNILATERAL</text><text x="148" y="393" font-size="26" fill="#26221f" font-weight="700">保加利亚分腿蹲</text><text x="148" y="421" font-size="17" fill="#686057">2 × 6–10 / 侧  ·  脚掌稳定 · 膝盖顺脚尖</text></g>
<g><rect x="70" y="451" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="88" y="471" width="44" height="44" rx="22" fill="#365a71" opacity=".14"/><text x="110" y="500" font-size="22" text-anchor="middle" font-weight="700" fill="#365a71">02</text><text x="148" y="477" font-size="14" letter-spacing="2" fill="#365a71" font-weight="700">POSTERIOR CHAIN</text><text x="148" y="512" font-size="26" fill="#26221f" font-weight="700">哑铃罗马尼亚硬拉</text><text x="148" y="540" font-size="17" fill="#686057">2 × 8–10  ·  髋向后坐 · 背部稳定</text></g>
<g><rect x="70" y="570" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="88" y="590" width="44" height="44" rx="22" fill="#365a71" opacity=".14"/><text x="110" y="619" font-size="22" text-anchor="middle" font-weight="700" fill="#365a71">03</text><text x="148" y="596" font-size="14" letter-spacing="2" fill="#365a71" font-weight="700">CALF / ANKLE</text><text x="148" y="631" font-size="26" fill="#26221f" font-weight="700">站姿提踵</text><text x="148" y="659" font-size="17" fill="#686057">2–3 × 10–15  ·  缓慢落下 · 全脚掌控制</text></g>
<g><rect x="70" y="689" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="88" y="709" width="44" height="44" rx="22" fill="#365a71" opacity=".14"/><text x="110" y="738" font-size="22" text-anchor="middle" font-weight="700" fill="#365a71">04</text><text x="148" y="715" font-size="14" letter-spacing="2" fill="#365a71" font-weight="700">PUSH / CHEST</text><text x="148" y="750" font-size="26" fill="#26221f" font-weight="700">上斜哑铃推 / 俯卧撑</text><text x="148" y="778" font-size="17" fill="#686057">2 × 8–12  ·  肩胛稳定 · 不憋气</text></g>
<g><rect x="70" y="808" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="88" y="828" width="44" height="44" rx="22" fill="#365a71" opacity=".14"/><text x="110" y="857" font-size="22" text-anchor="middle" font-weight="700" fill="#365a71">05</text><text x="148" y="834" font-size="14" letter-spacing="2" fill="#365a71" font-weight="700">PULL / BACK</text><text x="148" y="869" font-size="26" fill="#26221f" font-weight="700">划船（哑铃 / 绳索）</text><text x="148" y="897" font-size="17" fill="#686057">2 × 8–12  ·  手肘向后 · 不耸肩</text></g>
<g><rect x="70" y="927" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="88" y="947" width="44" height="44" rx="22" fill="#365a71" opacity=".14"/><text x="110" y="976" font-size="22" text-anchor="middle" font-weight="700" fill="#365a71">06</text><text x="148" y="953" font-size="14" letter-spacing="2" fill="#365a71" font-weight="700">CORE</text><text x="148" y="988" font-size="26" fill="#26221f" font-weight="700">死虫式 / 平板支撑</text><text x="148" y="1016" font-size="17" fill="#686057">2 组  ·  稳住腰背 · 保持呼吸</text></g>
<g><rect x="715" y="332" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="733" y="352" width="44" height="44" rx="22" fill="#b46a42" opacity=".14"/><text x="755" y="381" font-size="22" text-anchor="middle" font-weight="700" fill="#b46a42">01</text><text x="793" y="358" font-size="14" letter-spacing="2" fill="#b46a42" font-weight="700">PULL / UPPER BACK</text><text x="793" y="393" font-size="26" fill="#26221f" font-weight="700">高位下拉 / 辅助引体</text><text x="793" y="421" font-size="17" fill="#686057">2 × 8–12  ·  肩胛下沉 · 躯干稳定</text></g>
<g><rect x="715" y="451" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="733" y="471" width="44" height="44" rx="22" fill="#b46a42" opacity=".14"/><text x="755" y="500" font-size="22" text-anchor="middle" font-weight="700" fill="#b46a42">02</text><text x="793" y="477" font-size="14" letter-spacing="2" fill="#b46a42" font-weight="700">SHOULDER</text><text x="793" y="512" font-size="26" fill="#26221f" font-weight="700">哑铃侧平举</text><text x="793" y="540" font-size="17" fill="#686057">2 × 12–15  ·  小重量控制 · 勿甩动</text></g>
<g><rect x="715" y="570" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="733" y="590" width="44" height="44" rx="22" fill="#b46a42" opacity=".14"/><text x="755" y="619" font-size="22" text-anchor="middle" font-weight="700" fill="#b46a42">03</text><text x="793" y="596" font-size="14" letter-spacing="2" fill="#b46a42" font-weight="700">GLUTES</text><text x="793" y="631" font-size="26" fill="#26221f" font-weight="700">臀桥 / 轻台阶踏上</text><text x="793" y="659" font-size="17" fill="#686057">2 × 8–12  ·  臀部发力 · 不顶腰</text></g>
<g><rect x="715" y="689" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="733" y="709" width="44" height="44" rx="22" fill="#b46a42" opacity=".14"/><text x="755" y="738" font-size="22" text-anchor="middle" font-weight="700" fill="#b46a42">04</text><text x="793" y="715" font-size="14" letter-spacing="2" fill="#b46a42" font-weight="700">SOLEUS / CALF</text><text x="793" y="750" font-size="26" fill="#26221f" font-weight="700">屈膝提踵</text><text x="793" y="778" font-size="17" fill="#686057">2 × 10–15  ·  保持屈膝 · 慢起慢落</text></g>
<g><rect x="715" y="808" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="733" y="828" width="44" height="44" rx="22" fill="#b46a42" opacity=".14"/><text x="755" y="857" font-size="22" text-anchor="middle" font-weight="700" fill="#b46a42">05</text><text x="793" y="834" font-size="14" letter-spacing="2" fill="#b46a42" font-weight="700">STABILITY</text><text x="793" y="869" font-size="26" fill="#26221f" font-weight="700">侧平板 + 弹力带侧走</text><text x="793" y="897" font-size="17" fill="#686057">各 2 组  ·  肩髋对齐 · 控制骨盆</text></g>
<g><rect x="715" y="927" width="615" height="107" rx="12" fill="#ffffff" stroke="#d9d3c8" stroke-width="1"/><rect x="733" y="947" width="44" height="44" rx="22" fill="#b46a42" opacity=".14"/><text x="755" y="976" font-size="22" text-anchor="middle" font-weight="700" fill="#b46a42">06</text><text x="793" y="953" font-size="14" letter-spacing="2" fill="#b46a42" font-weight="700">FOOT / ARCH</text><text x="793" y="988" font-size="26" fill="#26221f" font-weight="700">短足训练 + 单腿平衡</text><text x="793" y="1016" font-size="17" fill="#686057">2 × 30秒 / 侧  ·  足弓轻激活 · 勿抓地</text></g>
<line x1="70" y1="1064" x2="1330" y2="1064" stroke="#aca397"/>
<text x="70" y="1104" font-size="20" fill="#302a24" font-weight="600">训练规则</text>
<text x="185" y="1104" font-size="18" fill="#574f47">热身5分钟 · 每组留2–3次余力 · 先掌握动作再加重 · 长跑前减轻腿部负荷</text>
<text x="70" y="1138" font-size="16" fill="#776d62">Original visual summary for micro-weekly / Seoul Campaign · Reference only; stop or modify if pain affects form.</text>
</g></svg>